{% if page.paginator.num_pages > 1 %}
<nav class="mt-4" aria-label="Pages">
  <ul class="pagination justify-content-center flex-wrap">
    {% if page.has_previous %}
    <li class="page-item"><a class="page-link" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page.previous_page_number }}">&laquo;</a></li>
    {% endif %}
    {% for n in page.paginator.page_range %}
    <li class="page-item {% if n == page.number %}active{% endif %}"><a class="page-link" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ n }}">{{ n }}</a></li>
    {% endfor %}
    {% if page.has_next %}
    <li class="page-item"><a class="page-link" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page.next_page_number }}">&raquo;</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
